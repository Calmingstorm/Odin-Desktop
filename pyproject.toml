[project]
name = "odin-desktop-engine"
version = "0.1.0.dev1"
description = "Odin Desktop execution engine, maintained from Odin v4.13.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "aiofiles>=24.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "pydantic>=2.0",
    "jsonschema>=4.23,<5",
    "packaging>=23.2",
    # The retained skill installer uses this engine interpreter, not a system pip.
    "pip>=26.2,<27",
    "regex>=2024.11.6",
    "croniter>=2.0.0",
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.0",
    # Credential storage is the Linux Secret Service, never a file fallback.
    "keyring>=25.6,<26",
    # Native image output must be fully decoded before it can be delivered.
    "Pillow>=12.3,<13",
    # D14: PDF downloads on first use; the browser ships in the distribution.
    "playwright>=1.40.0",
    "python-xlib>=0.33,<1",
    "dbus-next>=0.2.3,<1",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24.0"]
dev = [
    # Packaging regressions build a non-editable wheel without network/build
    # isolation. Match the backend's SPDX-license support, not editable imports.
    "setuptools>=77",
    "wheel>=0.45",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "ruff",
    "aioresponses>=0.7",
    "Pillow>=12.3,<13",
    # Computer contract tests import protocol clients, never a real desktop.
    # Keep these aligned with the computer extra so clean CI .[dev] installs work.
    "python-xlib>=0.33,<1; sys_platform == 'linux'",
    "dbus-next>=0.2.3,<1; sys_platform == 'linux'",
    # Type gate (RFC-005): checker + stubs pinned so CI findings are
    # deterministic — upgrades are deliberate PRs, never ambient drift.
    "mypy==2.1.0",
    "types-aiofiles==25.1.0.20260518",
    "types-PyYAML==6.0.12.20260518",
    "types-croniter==6.2.3.20260704",
    "types-jsonschema==4.26.0.20260518",
    "types-regex==2026.9.10.20260911",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "xdist_group(name): tests sharing process/desktop resources run on one worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long lines inside multi-line prompt/template string literals cannot be
# wrapped without changing the string bytes (prompt content is behavior),
# and a "#" inside a string is content, not a noqa comment. E501 is
# therefore suppressed for the template-bearing files as a whole.
"src/llm/system_prompt.py" = ["E501"]
"src/learning/reflector.py" = ["E501"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.computer.runtime" = ["assets/*", "assets/services/*"]
"src.tools" = ["model_hints_seed.json"]
