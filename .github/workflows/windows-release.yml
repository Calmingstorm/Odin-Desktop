name: Desktop Windows release candidate

# The Windows installer for a release tag, built on GitHub's hosted Windows and kept as a candidate,
# never published. Only release.yml takes tags (its jobs run on the self-hosted Linux builders), so
# this one runs by hand, by the owner, for a tag that is already pushed. Publication stays the manual
# verified-candidate operation. Signed with Artifact Signing (Aaron, 2026-10-12): the build signs
# Odin.exe, its uninstaller and the installer through packaging/sign-windows.cjs, signing in with
# GitHub's identity token in the release-signing environment (no stored secret, master only), so
# the acceptance and the receipt cover the signed bytes and check the signer.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (vX.Y.Z), already pushed
        required: true
        type: string

permissions: {}
concurrency:
  group: odin-desktop-release-windows
  cancel-in-progress: false

jobs:
  candidate:
    name: Build Windows candidate
    if: github.repository == 'Calmingstorm/Odin-Desktop' && github.actor == 'Calmingstorm'
    runs-on: windows-2025
    timeout-minutes: 90
    # Only this job can sign: the environment's federated credential is the Azure identity's only
    # sign-in, and the environment takes runs from master alone.
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      ODIN_SIGNING_ENDPOINT: https://eus.codesigning.azure.net
      ODIN_SIGNING_ACCOUNT: Odin
      ODIN_SIGNING_PROFILE: OdinDesktop
      ODIN_SIGNING_PUBLISHER: Aaron Charpentier
    steps:
      - name: The input is a release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "not a release tag: $env:RELEASE_TAG"
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: The checkout is the tag, unchanged, and the product version is the tag's
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = python -I -B scripts/release/windows_candidate.py validate --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build-time Python tools only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv python install 3.12.15
          uv venv --python 3.12.15 .venv
          uv pip install --python .venv\Scripts\python.exe setuptools==84.0.0 wheel==0.48.0
          uv sync --locked --extra dev --no-build-isolation-package odin-desktop-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision pinned Electron
        shell: pwsh
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision the pinned signing tools (release signing only, never bundled)
        shell: pwsh
        env:
          ODIN_PACKAGING_CACHE: ${{ runner.temp }}\pc
        run: |
          $lines = @(python -I -B app/packaging/provision-signing.py "$env:RUNNER_TEMP\signing")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Beyond its pinned digest: SignTool is Microsoft's own executable, and the library needs .NET 8.
          $tool = ($lines | Where-Object { $_ -like 'ODIN_SIGNTOOL=*' }) -replace '^ODIN_SIGNTOOL=', ''
          $signature = Get-AuthenticodeSignature -LiteralPath $tool
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation,') {
            throw "SignTool isn't validly signed by Microsoft: $($signature.Status), $($signature.SignerCertificate.Subject)"
          }
          if (-not (dotnet --list-runtimes | Select-String -SimpleMatch 'Microsoft.NETCore.App 8.')) {
            throw 'the Artifact Signing library needs the .NET 8 runtime'
          }
      - name: Sign in to Azure with GitHub's identity token (no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: The signing service's token, while GitHub's identity token is fresh
        shell: pwsh
        run: |
          # GitHub's identity token is short-lived and the build signs well after this, so the Azure CLI
          # holds the signing service's access token now, for the library's sign-ins through it.
          $expires = az account get-access-token --scope https://codesigning.azure.net/.default --query expiresOn -o tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "The signing service's token lasts until $expires"
      - name: Build the per-user installer with release provenance
        shell: pwsh
        working-directory: app
        env:
          ODIN_PACKAGING_RELEASE: '1'
          ODIN_WINDOWS_SIGNING: '1'
          # Release provenance builds from a git-object copy of the source inside this cache; the default
          # cache in the user profile plus the deepest committed path passes Windows' 260-character limit.
          ODIN_PACKAGING_CACHE: ${{ runner.temp }}\pc
        run: |
          node packaging/build-windows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The installer, elevated and as a disposable standard user
        shell: powershell
        run: |
          # Exactly the installer the receipt retains: the report records these bytes' SHA-256.
          $setup = Join-Path (Resolve-Path .packaging-candidates) `
            "odin-desktop-$env:RELEASE_VERSION-candidate-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "no installer at $setup" }
          & .\scripts\packaging\windows-installer-acceptance.ps1 -Installer $setup -Packaging app\packaging `
            -Python .venv\Scripts\python.exe -Report "$env:RUNNER_TEMP\windows-installer-acceptance.json" `
            -Publisher $env:ODIN_SIGNING_PUBLISHER
          exit $LASTEXITCODE
      - name: Candidate receipt
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python -I -B scripts/release/windows_candidate.py receipt --tag $env:RELEASE_TAG `
            --candidates .packaging-candidates `
            --report "$env:RUNNER_TEMP\windows-installer-acceptance.json" --out windows-candidate `
            --publisher $env:ODIN_SIGNING_PUBLISHER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload the acceptance report, passed or not (not an installer)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-installer-acceptance.json
          if-no-files-found: warn
      - name: Retain the candidate in Actions storage, not a Release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-windows-${{ github.run_id }}
          path: windows-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
