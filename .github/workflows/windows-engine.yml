name: Windows engine

# Called from "Phase 1 engine boundaries" so its coverage evidence belongs to the
# same run and revision.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-runtime:
    if: github.repository == 'Calmingstorm/Odin-Desktop'
    name: windows staged runtime (Server 2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build-time Python tools only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv python install 3.12.15
          uv venv --python 3.12.15 .venv
          uv pip install --python .venv\Scripts\python.exe setuptools==84.0.0 wheel==0.48.0
          uv sync --locked --extra dev --no-build-isolation-package odin-desktop-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Provision pinned Electron for resource notices
        shell: pwsh
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage immutable Windows runtime from the clean revision
        shell: pwsh
        run: |
          .venv\Scripts\python.exe app/packaging/build-runtime.py --platform win32 --provenance release `
            --stage "$env:RUNNER_TEMP\odin-runtime-resources" --cache "$env:RUNNER_TEMP\odin-runtime-inputs" `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-runtime-stage.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native staged consumers outside checkout with cold caches and sanitized PATH
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts/packaging/windows-runtime-acceptance.py `
            --resources "$env:RUNNER_TEMP\odin-runtime-resources" `
            --report "$env:RUNNER_TEMP\windows-runtime-acceptance.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload private runtime evidence (not an installer or published candidate)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-acceptance
          path: |
            ${{ runner.temp }}/windows-runtime-stage.log
            ${{ runner.temp }}/windows-runtime-acceptance.json
            ${{ runner.temp }}/odin-runtime-resources/bundle-manifest.json
            ${{ runner.temp }}/odin-runtime-resources/*-metadata.json
          if-no-files-found: warn
  windows-engine:
    if: github.repository == 'Calmingstorm/Odin-Desktop'
    name: windows engine (Server 2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Locked environment on the bundle's Python (python-build-standalone 3.12.15)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv python install 3.12.15
          uv venv --python 3.12.15 .venv
          uv pip install --python .venv\Scripts\python.exe setuptools==84.0.0 wheel==0.48.0
          uv sync --locked --extra dev --no-build-isolation-package odin-desktop-engine
          .venv\Scripts\python.exe -c "import sys; print(sys.version)"
      - name: Native Windows engine tests
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pytest tests/windows tests/test_desktop_platform_variants.py `
            -q -p no:cacheprovider -rfEs --cov=src/desktop/platform --cov-report=json:coverage-windows.json `
            --cov-report=term-missing
      - name: Record the revision and the measured sources
        shell: pwsh
        env:
          REVISION: ${{ github.sha }}
        run: |
          .venv\Scripts\python.exe -c "import hashlib, json, os, pathlib; inventory = json.loads(pathlib.Path('maintenance/windows-only-files.json').read_text()); sources = {path: hashlib.sha256(pathlib.Path(path).read_bytes().replace(b'\r\n', b'\n')).hexdigest() for path in inventory}; pathlib.Path('coverage-windows-provenance.json').write_text(json.dumps({'sha': os.environ['REVISION'], 'sources': sources}, indent=2))"
      - name: The app's Windows platform (typecheck, Windows tests, the real engine's pipe name)
        shell: pwsh
        working-directory: app
        env:
          ODIN_ENGINE_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npx vitest run test/windows-platform.test.ts test/coverage-windows-smoke.test.ts
      - name: The real app from source with a scripted model (Windows smoke)
        shell: pwsh
        working-directory: app
        env:
          # A hosted runner has no GPU; Electron's sandbox stays on.
          ODIN_WINDOWS_SMOKE_NO_GPU: '1'
          ODIN_WINDOWS_SMOKE_REVISION: ${{ github.sha }}
          ODIN_WINDOWS_SMOKE_REPORT: ${{ github.workspace }}\windows-smoke-report.json
        run: |
          node node_modules/electron/install.js
          npm run build
          node scripts/windows-real-core-smoke.mjs
      - name: Upload the Windows smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-report
          path: windows-smoke-report.json
          if-no-files-found: warn
      - name: Upload Windows coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-windows
          path: |
            coverage-windows.json
            coverage-windows-provenance.json
          if-no-files-found: error
