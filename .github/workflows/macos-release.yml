name: macOS signed build

# The signed, notarized Mac app (phase 5), dispatched by hand like windows-release.yml: from a
# release tag on master, or from macos/port until the port merges. It runs on GitHub's macOS 26 in
# the protected macos-signing environment, whose secrets only this job sees. It signs on a
# disposable keychain, has Apple notarize the app and the .dmg, verifies both, runs the installed-
# app acceptance on the signed app, and keeps the .dmg with its receipt. Nothing is published.
# It can also be called (workflow_call) by a workflow on another branch: GitHub dispatches only
# workflows that are on the default branch. The environment's branches still decide where it runs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (macos/port, or a release tag on master)
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed:
    if: github.repository == 'Calmingstorm/Odin-Desktop' && github.actor == 'Calmingstorm'
    name: signed Mac app (macOS 26, Apple silicon)
    runs-on: macos-26
    timeout-minutes: 150
    environment: macos-signing
    concurrency:
      group: macos-signed-${{ inputs.ref }}
      cancel-in-progress: false
    env:
      IDENTITY: 'Developer ID Application: Aaron Charpentier (3HSA4RMW29)'
      TEAM: 3HSA4RMW29
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Locked environment on the bundle's Python (python-build-standalone 3.12.15)
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv python install 3.12.15
          uv venv --python 3.12.15 .venv
          uv pip install --python .venv/bin/python setuptools==84.0.0 wheel==0.48.0
          uv sync --locked --extra dev --no-build-isolation-package odin-desktop-engine
      - name: Provision pinned Electron
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: A disposable signing keychain, and the notary key
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          keychain="$work/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 9000 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # codesign builds the chain to Apple's root only from keychains on the search list.
          listed=()
          while IFS= read -r line; do
            listed+=("$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${listed[@]}"
          printf '%s' "$P12" | base64 --decode > "$work/identity.p12"
          security import "$work/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$work/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$IDENTITY\"" > /dev/null
          printf '%s\n' "$NOTARY_KEY" > "$work/notary.p8"
          {
            echo "ODIN_MACOS_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$work/notary.p8"
          } >> "$GITHUB_ENV"
      - name: Build, sign and notarize the app and the disk image
        working-directory: app
        env:
          ODIN_MACOS_SIGN_IDENTITY: ${{ env.IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: node packaging/build-macos.mjs --signed
      - name: Verify the signed app and disk image
        run: |
          set -euo pipefail
          dmg="$(ls .packaging-candidates/odin-desktop-*-arm64.dmg)"
          mount="$RUNNER_TEMP/odin signed image"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/Odin.app"
          spctl --assess --type execute -vv "$mount/Odin.app" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
          grep -F "source=Notarized Developer ID" "$RUNNER_TEMP/spctl-app.txt"
          xcrun stapler validate "$mount/Odin.app"
          xcrun stapler validate "$dmg"
          .venv/bin/python -I -B app/packaging/verify-macos-signatures.py "$mount/Odin.app" --team "$TEAM"
      - name: The signed app from the disk image, copied to a path with spaces and driven end to end
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          dmg="$(ls .packaging-candidates/odin-desktop-*-arm64.dmg)"
          digest="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          echo "DMG_SHA256=$digest" >> "$GITHUB_ENV"
          mount="$RUNNER_TEMP/odin disk image"
          target="$RUNNER_TEMP/Odin Acceptance/Applications"
          mkdir -p "$mount" "$target"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          ditto "$mount/Odin.app" "$target/Odin.app"
          hdiutil detach "$mount"
          ODIN_MACOS_PACKAGED_APP="$target/Odin.app" ODIN_MACOS_PACKAGED_REVISION="$REVISION" \
          ODIN_MACOS_PACKAGED_DMG_SHA256="$digest" \
          ODIN_MACOS_PACKAGED_REPORT="$RUNNER_TEMP/macos-signed-acceptance.json" \
            .venv/bin/python -m pytest tests/macos/test_packaged_app.py -q -p no:cacheprovider -rfEs
      - name: The receipt
        env:
          REF: ${{ inputs.ref }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          dmg="$(ls .packaging-candidates/odin-desktop-*-arm64.dmg)"
          .venv/bin/python -I - "$dmg" <<'PY'
          import json, os, sys
          from pathlib import Path
          dmg = Path(sys.argv[1])
          receipt = {
              "ref": os.environ["REF"], "revision": os.environ["REVISION"],
              "disk_image": dmg.name, "sha256": os.environ["DMG_SHA256"],
              "identity": os.environ["IDENTITY"], "team": os.environ["TEAM"],
              "disk_image_notarization": json.loads(Path(f"{dmg}.notary.json").read_text()),
              "app_assessment": Path(os.environ["RUNNER_TEMP"], "spctl-app.txt").read_text().strip(),
          }
          Path(f"{dmg}.receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Keep the signed disk image, its receipt and the acceptance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-signed-candidate
          path: |
            .packaging-candidates/odin-desktop-*-arm64.dmg
            .packaging-candidates/odin-desktop-*-arm64.dmg.receipt.json
            .packaging-candidates/odin-desktop-*-arm64.dmg.notary.json
            ${{ runner.temp }}/macos-signed-acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          if [ -n "${ODIN_MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$ODIN_MACOS_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"
