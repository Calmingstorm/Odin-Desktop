name: macOS engine

# Called from "Phase 1 engine boundaries" so its coverage evidence belongs to the
# same run and revision.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  macos-engine:
    if: github.repository == 'Calmingstorm/Odin-Desktop'
    name: macos engine (macOS 26, Apple silicon)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Locked environment on the bundle's Python (python-build-standalone 3.12.15)
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv python install 3.12.15
          uv venv --python 3.12.15 .venv
          uv pip install --python .venv/bin/python setuptools==84.0.0 wheel==0.48.0
          uv sync --locked --extra dev --no-build-isolation-package odin-desktop-engine
          .venv/bin/python -c "import platform, sys; print(sys.version, platform.machine(), platform.mac_ver()[0])"
      - name: A disposable keychain for the item tests, named explicitly (not default, not searched)
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keychain="$RUNNER_TEMP/odin-test.keychain-db"
          searched=()  # bash 3.2 has no mapfile
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; line="${line#\"}"; searched+=("${line%\"}")
          done < <(security list-keychains -d user)
          security create-keychain -p "$password" "$keychain"
          # create-keychain adds it to the search list: restore the account's own list exactly.
          security list-keychains -d user -s "${searched[@]}"
          if security list-keychains -d user | grep -qF "$keychain"; then exit 1; fi
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          {
            echo "ODIN_MACOS_DISPOSABLE_KEYCHAIN=1"
            echo "ODIN_MACOS_DISPOSABLE_KEYCHAIN_PATH=$keychain"
            echo "ODIN_MACOS_DISPOSABLE_KEYCHAIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build odin-guardian (the app's engine supervisor)
        run: |
          app/packaging/macos/guardian/build.sh "$RUNNER_TEMP/odin-guardian"
          echo "ODIN_GUARDIAN=$RUNNER_TEMP/odin-guardian" >> "$GITHUB_ENV"
      - name: Native macOS engine tests
        env:
          # This disposable runner may serve the SSH test's own sshd on its address.
          ODIN_MACOS_SSH_TEST: '1'
        run: |
          .venv/bin/python -m pytest tests/macos tests/test_desktop_platform_variants.py \
            -q -p no:cacheprovider -rfEs --cov=src/desktop/platform \
            --cov-report=json:coverage-macos.json --cov-report=term-missing
      - name: Record the revision and the measured sources
        env:
          REVISION: ${{ github.sha }}
        run: |
          .venv/bin/python -c "import hashlib, json, os, pathlib; inventory = json.loads(pathlib.Path('maintenance/macos-only-files.json').read_text()); sources = {path: hashlib.sha256(pathlib.Path(path).read_bytes().replace(b'\r\n', b'\n')).hexdigest() for path in inventory}; pathlib.Path('coverage-macos-provenance.json').write_text(json.dumps({'sha': os.environ['REVISION'], 'sources': sources}, indent=2))"
      - name: Upload macOS coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-macos
          path: |
            coverage-macos.json
            coverage-macos-provenance.json
          if-no-files-found: error
