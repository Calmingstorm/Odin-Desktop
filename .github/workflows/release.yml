name: Desktop release candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run uploads nothing; publication requires an existing approved candidate
        type: choice
        options: [dry-run, retain-candidate, publish-approved]
        default: dry-run
        required: true
      version:
        description: Exact current product version (never rewritten by CI)
        default: '0.1.0'
        required: true
        type: string
      candidate_run_id:
        description: Successful retained candidate run ID (publish only)
        type: string
      candidate_artifact_id:
        description: Immutable Actions artifact ID (publish only)
        type: string
      candidate_artifact_digest:
        description: Exact sha256-prefixed digest of the retained artifact ZIP (publish only)
        type: string
      source_sha:
        description: Exact candidate source commit (publish only)
        type: string
      workflow_sha:
        description: Exact candidate and current trusted workflow commit (publish only)
        type: string
      receipt_sha:
        description: SHA256 of candidate-receipt.json (publish only)
        type: string
      approval_json:
        description: Aaron approval of identical bytes and reviewed P4.5/P4.6 evidence (publish only)
        type: string
  push:
    tags: ['v*']

permissions: {}
concurrency:
  group: odin-desktop-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build candidate
    if: github.repository == 'Calmingstorm/Odin-Desktop' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.actor == 'Calmingstorm') || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish-approved' && github.ref == 'refs/heads/main' && (inputs.mode == 'dry-run' || github.actor == 'Calmingstorm')))
    runs-on: [self-hosted, odin-desktop-ci]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: Require cached Python 3.12 and Node.js 22
        working-directory: release-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B scripts/release/provision_cached_tools.py --require-node
      - name: Build, scan and check without build credentials
        working-directory: release-build-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          UV_PYTHON_DOWNLOADS: never
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: python3 -B scripts/release/workflow_entry.py
      - name: Retain identical candidate in Actions storage, not a Release
        id: retain
        if: github.actor == 'Calmingstorm' && (github.event_name == 'push' || inputs.mode == 'retain-candidate')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-build-${{ github.run_id }}-${{ github.run_attempt }}/release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
      - name: Immutable storage receipt
        if: steps.retain.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.retain.outputs.artifact-digest }}
        run: printf 'Actions artifact ID `%s`, ZIP SHA256 `%s`. Not a GitHub Release.\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify approved candidate
    if: github.repository == 'Calmingstorm/Odin-Desktop' && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-approved' && github.actor == 'Calmingstorm' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, odin-desktop-ci]
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-verify-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: false
      - name: Require cached Python 3.12
        working-directory: release-verify-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B scripts/release/provision_cached_tools.py
      - name: Audit protection and verify immutable provenance before environment review
        working-directory: release-verify-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXPECTED_RECEIPT_SHA: ${{ inputs.receipt_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
        run: python3 -B scripts/release/actions_control.py verify --directory verified-candidate

  publish:
    name: Publish identical approved candidate
    needs: verify
    if: github.repository == 'Calmingstorm/Odin-Desktop' && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-approved' && github.actor == 'Calmingstorm' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: [self-hosted, odin-desktop-ci]
    timeout-minutes: 20
    environment:
      name: odin-desktop-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: release-publish-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          submodules: false
      - name: Require cached Python 3.12
        working-directory: release-publish-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B scripts/release/provision_cached_tools.py
      - name: Repeat protection/provenance checks and publish once, never rebuild
        working-directory: release-publish-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          EXPECTED_RECEIPT_SHA: ${{ inputs.receipt_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
        run: python3 -B scripts/release/actions_control.py publish --directory verified-candidate
