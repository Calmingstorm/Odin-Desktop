name: macOS app

# Called from "Phase 1 engine boundaries": the Mac candidate built from this revision (unsigned;
# phase 5's release build signs and notarizes), then the installed app driven end to end on this
# disposable Mac. Nothing is published.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  macos-app:
    if: github.repository == 'Calmingstorm/Odin-Desktop'
    name: macos app (macOS 26, Apple silicon)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Locked environment on the bundle's Python (python-build-standalone 3.12.15)
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.23
          uv python install 3.12.15
          uv venv --python 3.12.15 .venv
          uv pip install --python .venv/bin/python setuptools==84.0.0 wheel==0.48.0
          uv sync --locked --extra dev --no-build-isolation-package odin-desktop-engine
          .venv/bin/python -c "import platform, sys; print(sys.version, platform.machine(), platform.mac_ver()[0])"
      - name: Provision pinned Electron
        working-directory: app
        run: |
          node --version
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/electron/install.js
      - name: Build the Mac candidate with packaging/build-macos.mjs (unsigned)
        working-directory: app
        run: node packaging/build-macos.mjs
      - name: The installed app, started as a user starts it and driven end to end
        run: |
          app="$PWD/.packaging-candidates/mac-arm64/Odin.app"
          ls -d "$app"
          ODIN_MACOS_PACKAGED_APP="$app" ODIN_MACOS_PACKAGED_REPORT="$RUNNER_TEMP/macos-app-acceptance.json" \
            .venv/bin/python -m pytest tests/macos/test_packaged_app.py -q -p no:cacheprovider -rfEs
      - name: Upload the acceptance report and the bundle's records (not a candidate)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app-acceptance
          path: |
            ${{ runner.temp }}/macos-app-acceptance.json
            .packaging-candidates/mac-arm64/Odin.app/Contents/Resources/bundle-manifest.json
            .packaging-stage/*-metadata.json
          if-no-files-found: warn
