name: Phase 1 engine boundaries
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  short-gates:
    if: github.repository == 'Calmingstorm/Odin-Desktop' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == 'Calmingstorm/Odin-Desktop'))
    name: short-gates (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: light
            labels: [self-hosted, odin-desktop-ci-light]
          - lane: desktop
            labels: [self-hosted, odin-desktop-short]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The merged accounting gates read pinned historical Git objects.
          fetch-depth: 0
      - name: Require the runner's cached Python 3.12
        id: cached-python
        shell: bash
        run: |
          versions=()
          for marker in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64.complete; do
            version="$(basename "$(dirname "$marker")")"
            if [[ "$version" =~ ^3\.12\.[0-9]+$ && -f "$marker" && -x "${marker%.complete}/bin/python" ]]; then
              versions+=("$version")
            fi
          done
          if [[ "${#versions[@]}" == 0 ]]; then
            echo "::error::Provision Python 3.12 in this runner's tool cache; CI will not download it."
            exit 1
          fi
          version="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          actual="$("$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          [[ "$actual" == "$version" ]] || { echo "::error::Cached Python version mismatch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.cached-python.outputs.version }}
          architecture: x64
      - name: Repository-only locked environment
        run: |
          # Preserve the executable trust fixture on persistent runners too.
          python -m venv --copies .venv
          # deadsnakes tool-cache entries need the locked backend in this venv;
          # their interpreter layout cannot load uv's temporary build backend.
          .venv/bin/python -m pip install uv==0.12.23 setuptools==84.0.0 wheel==0.48.0
          .venv/bin/uv sync --locked --extra dev --active --no-build-isolation-package odin-desktop-engine
      - name: Offline lineage and safety drift
        run: .venv/bin/python scripts/maintenance/inventory.py report
      - name: No new lint findings
        run: .venv/bin/python scripts/maintenance/lint_gate.py
      - name: Phase 2 planned ownership checker
        run: .venv/bin/python scripts/maintenance/phase2_plan.py
      - name: D19 exact wording disposition inventory
        run: .venv/bin/python scripts/maintenance/d19.py report
      - name: Phase 2 closure inventory (report only)
        run: .venv/bin/python scripts/maintenance/phase2_closure.py report
      - name: Hermetic Cinnamon and GNOME fixtures (no graphical session)
        run: .venv/bin/python scripts/run-phase1-tests.py tests/test_lab_cinnamon.py tests/test_lab_gnome.py -rs
  full-suites:
    if: github.repository == 'Calmingstorm/Odin-Desktop' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == 'Calmingstorm/Odin-Desktop'))
    runs-on: [self-hosted, odin-desktop-ci]
    # Plan groups run once with their original JUnit receipts; the additional
    # Desktop step covers only files outside that plan. Keep master's existing bound.
    timeout-minutes: 120
    env:
      ODIN_COVERAGE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the runner's cached Python 3.12
        id: cached-python
        shell: bash
        run: |
          versions=()
          for marker in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64.complete; do
            version="$(basename "$(dirname "$marker")")"
            if [[ "$version" =~ ^3\.12\.[0-9]+$ && -f "$marker" && -x "${marker%.complete}/bin/python" ]]; then
              versions+=("$version")
            fi
          done
          if [[ "${#versions[@]}" == 0 ]]; then
            echo "::error::Provision Python 3.12 in this runner's tool cache; CI will not download it."
            exit 1
          fi
          version="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          actual="$("$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          [[ "$actual" == "$version" ]] || { echo "::error::Cached Python version mismatch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.cached-python.outputs.version }}
          architecture: x64
      - name: Repository-only locked environment
        run: |
          # Fake-peer identity tests pin the real test interpreter. Runner
          # toolcache binaries can be group-writable, which the unchanged
          # executable trust guard correctly refuses. A repository-owned 0755
          # copy is an explicit trusted fixture, not a relaxed production check.
          python -m venv --copies .venv
          .venv/bin/python -m pip install uv==0.12.23 setuptools==84.0.0 wheel==0.48.0
          .venv/bin/uv sync --locked --extra dev --active --no-build-isolation-package odin-desktop-engine
      - name: Private tmpfs scratch for test I/O
        run: |
          rm -f .test-state/.coverage
          scratch="/dev/shm/odin-ci-$RUNNER_NAME"
          rm -rf "$scratch"
          mkdir -m 700 "$scratch"
          echo "ODIN_TEST_SCRATCH=$scratch" >> "$GITHUB_ENV"
      - name: App launcher unit and real-core contracts (no graphical session)
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- test/isolation-launcher.test.ts test/shard-orchestration.test.ts
          npm test -- --coverage
          # Four isolated namespace shards share a 10-minute aggregate bound
          # (5 minutes each), not four successive 10-minute allowances.
          npm run test:real-core
      - name: Additional Desktop boundaries in a PID namespace
        id: pass-now
        run: .venv/bin/python scripts/run-phase1-tests.py --additional-desktop-boundaries
      - name: Qualification lab orchestration (offline, no host daemon)
        if: ${{ !cancelled() && steps.pass-now.outcome != 'skipped' }}
        run: |
          .venv/bin/ruff check scripts/qualification/lab scripts/run-lab-fixture-tests.py app/test/e2e/orca-guest.py tests/test_desktop_lab_fixture_runner.py tests/test_desktop_qualification_lab.py tests/test_lab_*.py tests/test_orca_guest_tasks.py tests/test_native_dialog_events.py tests/test_orca_native_input.py tests/test_kde_portal_preparation.py
          .venv/bin/python scripts/run-phase1-tests.py tests/test_lab_orca.py tests/test_lab_orca_guest.py tests/test_lab_orca_cleanup.py tests/test_orca_guest_tasks.py tests/test_native_dialog_events.py tests/test_lab_focused_probe.py tests/test_orca_native_input.py tests/test_kde_portal_preparation.py tests/test_lab_orca_ci.py
          # Fixed offline corpus uses fresh fixture user namespaces; unsupported
          # mappings skip explicitly. Never relax the unchanged PID helper's NNP.
          .venv/bin/python scripts/run-lab-fixture-tests.py

      - name: Remove tmpfs scratch
        if: always()
        run: rm -rf "/dev/shm/odin-ci-$RUNNER_NAME"
      - name: Upload full-suite coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-full-suites
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .test-state/.coverage
            app/coverage/
  qualification:
    env:
      ODIN_COVERAGE: '1'
    # Each job preserves its own coverage data; combine happens only after success.
    name: qualification (${{ matrix.shard }}/5)
    if: github.repository == 'Calmingstorm/Odin-Desktop' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == 'Calmingstorm/Odin-Desktop'))
    runs-on: [self-hosted, odin-desktop-ci]
    # Whole qualification groups split by measured duration into parallel
    # shards; together they run the plan exactly once, each group intact.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the runner's cached Python 3.12
        id: cached-python
        shell: bash
        run: |
          versions=()
          for marker in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64.complete; do
            version="$(basename "$(dirname "$marker")")"
            if [[ "$version" =~ ^3\.12\.[0-9]+$ && -f "$marker" && -x "${marker%.complete}/bin/python" ]]; then
              versions+=("$version")
            fi
          done
          if [[ "${#versions[@]}" == 0 ]]; then
            echo "::error::Provision Python 3.12 in this runner's tool cache; CI will not download it."
            exit 1
          fi
          version="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          actual="$("$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          [[ "$actual" == "$version" ]] || { echo "::error::Cached Python version mismatch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.cached-python.outputs.version }}
          architecture: x64
      - name: Repository-only locked environment
        run: |
          # Fake-peer identity tests pin the real test interpreter. Runner
          # toolcache binaries can be group-writable, which the unchanged
          # executable trust guard correctly refuses. A repository-owned 0755
          # copy is an explicit trusted fixture, not a relaxed production check.
          python -m venv --copies .venv
          .venv/bin/python -m pip install uv==0.12.23 setuptools==84.0.0 wheel==0.48.0
          .venv/bin/uv sync --locked --extra dev --active --no-build-isolation-package odin-desktop-engine
      - name: Private tmpfs scratch for test I/O
        run: |
          rm -f .test-state/.coverage
          scratch="/dev/shm/odin-ci-$RUNNER_NAME"
          rm -rf "$scratch"
          mkdir -m 700 "$scratch"
          echo "ODIN_TEST_SCRATCH=$scratch" >> "$GITHUB_ENV"
      - name: Classified qualification shard in PID namespaces
        env:
          QUALIFICATION_SHARD: ${{ matrix.shard }}
        run: .venv/bin/python scripts/run-qualified-tests.py --shard "$QUALIFICATION_SHARD/5"
      - name: Remove tmpfs scratch
        if: always()
        run: rm -rf "/dev/shm/odin-ci-$RUNNER_NAME"
      - name: Upload qualification coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-qualification-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          path: .test-state/.coverage
  coverage:
    name: coverage no-drop ratchet
    needs: [full-suites, qualification]
    if: github.repository == 'Calmingstorm/Odin-Desktop' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == 'Calmingstorm/Odin-Desktop'))
    runs-on: [self-hosted, odin-desktop-short]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the runner's cached Python 3.12
        id: cached-python
        shell: bash
        run: |
          versions=()
          for marker in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64.complete; do
            version="$(basename "$(dirname "$marker")")"
            if [[ "$version" =~ ^3\.12\.[0-9]+$ && -f "$marker" && -x "${marker%.complete}/bin/python" ]]; then
              versions+=("$version")
            fi
          done
          if [[ "${#versions[@]}" == 0 ]]; then
            echo "::error::Provision Python 3.12 in this runner's tool cache; CI will not download it."
            exit 1
          fi
          version="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          actual="$("$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          [[ "$actual" == "$version" ]] || { echo "::error::Cached Python version mismatch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.cached-python.outputs.version }}
          architecture: x64
      - name: Repository-only report environment
        run: |
          python -m venv --copies .venv
          .venv/bin/python -m pip install coverage==7.16.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-input
      - name: Combine engine measurements and evaluate both ratchets
        run: |
          rm -rf coverage
          mkdir -p coverage
          .venv/bin/python scripts/ci/desktop_coverage_gate.py --combine coverage-input --output coverage --app-json coverage-input/coverage-full-suites/app/coverage/coverage-final.json
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          if-no-files-found: error
          path: coverage/
