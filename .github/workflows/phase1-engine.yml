name: Phase 1 engine boundaries
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  short-gates:
    runs-on: [self-hosted, odin-desktop-ci-light]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the runner's cached Python 3.12
        id: cached-python
        shell: bash
        run: |
          versions=()
          for marker in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64.complete; do
            version="$(basename "$(dirname "$marker")")"
            if [[ "$version" =~ ^3\.12\.[0-9]+$ && -f "$marker" && -x "${marker%.complete}/bin/python" ]]; then
              versions+=("$version")
            fi
          done
          if [[ "${#versions[@]}" == 0 ]]; then
            echo "::error::Provision Python 3.12 in this runner's tool cache; CI will not download it."
            exit 1
          fi
          version="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          actual="$("$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          [[ "$actual" == "$version" ]] || { echo "::error::Cached Python version mismatch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.cached-python.outputs.version }}
          architecture: x64
      - name: Repository-only locked environment
        run: |
          # Preserve the executable trust fixture on persistent runners too.
          python -m venv --copies .venv
          .venv/bin/python -m pip install uv==0.12.23
          .venv/bin/uv sync --locked --extra dev --active
      - name: Offline lineage and safety drift
        run: .venv/bin/python scripts/maintenance/inventory.py report
      - name: No new lint findings
        run: .venv/bin/python scripts/maintenance/lint_gate.py
      - name: Phase 2 planned ownership checker
        run: .venv/bin/python scripts/maintenance/phase2_plan.py
  full-suites:
    runs-on: [self-hosted, odin-desktop-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require the runner's cached Python 3.12
        id: cached-python
        shell: bash
        run: |
          versions=()
          for marker in "$RUNNER_TOOL_CACHE"/Python/3.12.*/x64.complete; do
            version="$(basename "$(dirname "$marker")")"
            if [[ "$version" =~ ^3\.12\.[0-9]+$ && -f "$marker" && -x "${marker%.complete}/bin/python" ]]; then
              versions+=("$version")
            fi
          done
          if [[ "${#versions[@]}" == 0 ]]; then
            echo "::error::Provision Python 3.12 in this runner's tool cache; CI will not download it."
            exit 1
          fi
          version="$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)"
          actual="$("$RUNNER_TOOL_CACHE/Python/$version/x64/bin/python" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          [[ "$actual" == "$version" ]] || { echo "::error::Cached Python version mismatch"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.cached-python.outputs.version }}
          architecture: x64
      - name: Repository-only locked environment
        run: |
          # Fake-peer identity tests pin the real test interpreter. Runner
          # toolcache binaries can be group-writable, which the unchanged
          # executable trust guard correctly refuses. A repository-owned 0755
          # copy is an explicit trusted fixture, not a relaxed production check.
          python -m venv --copies .venv
          .venv/bin/python -m pip install uv==0.12.23
          .venv/bin/uv sync --locked --extra dev --active
      - name: Phase 2 checker behaviour in a PID namespace
        run: .venv/bin/python scripts/run-phase1-tests.py tests/test_desktop_phase2_plan.py
      - name: Explicit pass-now suites in a PID namespace
        id: pass-now
        run: .venv/bin/python scripts/run-phase1-tests.py
      - name: Full classified qualification in PID namespaces
        if: ${{ !cancelled() && steps.pass-now.outcome != 'skipped' }}
        run: .venv/bin/python scripts/run-qualified-tests.py
