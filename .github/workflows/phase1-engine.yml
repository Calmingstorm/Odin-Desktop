name: Phase 1 engine boundaries
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository-only locked environment
        run: |
          # Fake-peer identity tests pin the real test interpreter. Hosted
          # toolcache binaries can be group-writable, which the unchanged
          # executable trust guard correctly refuses. A repository-owned 0755
          # copy is an explicit trusted fixture, not a relaxed production check.
          python -m venv --copies .venv
          .venv/bin/python -m pip install uv==0.12.23
          .venv/bin/uv sync --locked --extra dev --active
      - name: Offline lineage and safety drift
        run: .venv/bin/python scripts/maintenance/inventory.py report
      - name: No new lint findings
        run: .venv/bin/python scripts/maintenance/lint_gate.py
      - name: Qualification lab orchestration (offline, no host daemon)
        run: |
          .venv/bin/ruff check scripts/qualification/lab tests/test_desktop_qualification_lab.py tests/test_lab_*.py
          .venv/bin/python scripts/run-phase1-tests.py tests/test_desktop_qualification_lab.py tests/test_lab_cinnamon.py tests/test_lab_common.py tests/test_lab_gnome.py tests/test_lab_kde.py tests/test_lab_hyprland.py tests/test_lab_guest_smoke.py
      - name: Phase 2 planned ownership and checker behaviour
        run: |
          .venv/bin/python scripts/maintenance/phase2_plan.py
          .venv/bin/python scripts/run-phase1-tests.py tests/test_desktop_phase2_plan.py
      - name: Explicit pass-now suites in a PID namespace
        run: .venv/bin/python scripts/run-qualified-tests.py
