appId: net.calmingstorm.odin.desktop
productName: odin-desktop
executableName: odin-desktop
asar: true
npmRebuild: false
afterPack: packaging/after-pack.cjs
electronVersion: 44.5.1
electronDist: node_modules/electron/dist
directories:
  output: ../.packaging-candidates
  buildResources: resources
files:
  - out/**
  - resources/icon.png
  - resources/tray.png
  - resources/tray@2x.png
  - package.json
  - '!**/*.map'
extraResources:
  - from: ../.packaging-stage/runtime
    to: runtime
  - from: ../.packaging-stage/bundle-manifest.json
    to: bundle-manifest.json
  - from: ../.packaging-stage/legal
    to: legal
  # Windows stage alone contains this allowlisted tree. Linux assembly refuses
  # tools/ before this shared matcher can copy a foreign platform payload.
  - from: ../.packaging-stage
    to: .
    filter:
      - tools/**
linux:
  extraResources:
    - from: packaging/apparmor-profile
      to: apparmor-profile
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Development
  icon: resources/icon.png
  artifactName: odin-desktop-${version}-candidate-${arch}.${ext}
  desktop:
    entry:
      Name: Odin
      Comment: Odin, your execution agent
      StartupWMClass: odin-desktop
      Actions: exit;
    desktopActions:
      exit:
        Name: Exit Odin
        Exec: odin-desktop --exit
# The per-user Windows installer (phase 4, P7): no elevation, no per-machine choice, a fixed
# folder under %LOCALAPPDATA%\Programs, HKCU registration only, and no launch from the finish page.
# Uninstall keeps the profile (chats, settings, keys), as Linux does. The Start Menu shortcut's
# AppUserModelID is appId, which the installed app sets for itself (identity.ts), so toasts are
# its own. The build names the product Odin for Windows only (packaging/build-windows.mjs).
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: odin-desktop-${version}-candidate-x64-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Odin
  uninstallDisplayName: Odin
  menuCategory: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
deb:
  packageName: odin-desktop
  afterInstall: ../.packaging-stage/deb-control/postinst
  afterRemove: ../.packaging-stage/deb-control/postrm
  fpm:
    - --deb-user
    - root
    - --deb-group
    - root
    - --before-install
    - ../.packaging-stage/deb-control/preinst
    - --before-remove
    - ../.packaging-stage/deb-control/prerm
    - --deb-pre-depends
    - python3
  appArmorProfile: packaging/apparmor-profile
  maintainer: Calmingstorm
  compression: xz
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2t64
    - libxshmfence1
    - libx11-xcb1
    - openssh-client
publish: null
